<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep purple-to-indigo background -->
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1E1040"/>
      <stop offset="100%" stop-color="#0B0618"/>
    </radialGradient>

    <!-- Neon glow for the N -->
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="2" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for bolt -->
    <filter id="boltGlow" x="-60%" y="-40%" width="220%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradient for the big N -->
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Gradient for the bolt accent -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" fill="url(#bg)" rx="22"/>

  <!-- Decorative outer ring -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#ringGrad)" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- Subtle inner glow circle -->
  <circle cx="64" cy="64" r="44" fill="#3B0FA0" opacity="0.15"/>

  <!-- Large stylized "N" (for npm) - bold geometric -->
  <g filter="url(#neonGlow)">
    <text
      x="64" y="82"
      font-family="Arial Black, Impact, sans-serif"
      font-size="72"
      font-weight="900"
      fill="url(#nGrad)"
      text-anchor="middle"
      letter-spacing="-2"
    >N</text>
  </g>

  <!-- Lightning bolt accent - overlaid bottom right -->
  <g transform="translate(80, 72)" filter="url(#boltGlow)">
    <!-- Bolt outer (glow color) -->
    <polygon points="12,0 5,14 11,14 6,28 19,9 12,9 17,0"
             fill="#FDE68A" opacity="0.3" transform="scale(1.15) translate(-1,-1)"/>
    <!-- Bolt main -->
    <polygon points="12,0 5,14 11,14 6,28 19,9 12,9 17,0"
             fill="url(#boltGrad)"/>
  </g>

  <!-- Small "npm" label at the bottom -->
  <text
    x="64" y="118"
    font-family="'Courier New', monospace"
    font-size="9"
    font-weight="bold"
    fill="#A78BFA"
    text-anchor="middle"
    opacity="0.8"
    letter-spacing="3"
  >npm</text>
</svg>
